<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield / Seal -->
  <path d="M50 4 C70 4, 90 12, 90 28 C90 62, 68 85, 50 96 C32 85, 10 62, 10 28 C10 12, 30 4, 50 4 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#glowRing)" 
        stroke-width="2.5" />

  <!-- Inner Concentric Golden Border -->
  <path d="M50 10 C66 10, 83 17, 83 31 C83 59, 65 79, 50 89 C35 79, 17 59, 17 31 C17 17, 34 10, 50 10 Z" 
        fill="#031510" 
        stroke="url(#goldGrad)" 
        stroke-width="1.2" 
        stroke-dasharray="1 2" />

  <!-- Sacred Sun Rays / Knowledge Emanation -->
  <g opacity="0.35" stroke="url(#goldGrad)" stroke-width="1">
    <line x1="50" y1="20" x2="50" y2="13" />
    <line x1="57" y1="22" x2="62" y2="17" />
    <line x1="62" y1="27" x2="69" y2="24" />
    <line x1="43" y1="22" x2="38" y2="17" />
    <line x1="38" y1="27" x2="31" y2="24" />
  </g>

  <!-- Ayurvedic Sacred Botanical Leaf Triad (Emblem of Ayurveda, Siddha, Unani) -->
  <!-- Central Dominant Herbal Leaf -->
  <path d="M50 20 C62 34, 66 52, 50 72 C34 52, 38 34, 50 20 Z" 
        fill="url(#leafGrad)" 
        filter="url(#glow)" />

  <!-- Left Supporting Botanical Leaf -->
  <path d="M50 42 C40 38, 30 45, 27 58 C35 64, 46 56, 50 42 Z" 
        fill="url(#leafGrad)" 
        opacity="0.9" />

  <!-- Right Supporting Botanical Leaf -->
  <path d="M50 42 C60 38, 70 45, 73 58 C65 64, 54 56, 50 42 Z" 
        fill="url(#leafGrad)" 
        opacity="0.9" />

  <!-- Golden Leaf Spine & Legal Axis of Symmetry -->
  <path d="M50 24 L50 74" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M50 36 C54 33, 58 35, 60 38" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" fill="none" />
  <path d="M50 46 C55 43, 61 46, 62 50" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" fill="none" />
  <path d="M50 36 C46 33, 42 35, 40 38" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" fill="none" />
  <path d="M50 46 C45 43, 39 46, 38 50" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" fill="none" />

  <!-- Scales of Legal Justice Base / Institutional Pedestal -->
  <path d="M38 74 Q50 71 62 74 L50 82 Z" fill="url(#goldGrad)" />
  <circle cx="50" cy="80" r="2.5" fill="#fef08a" />
  <circle cx="50" cy="22" r="2" fill="#fef08a" filter="url(#glow)" />
</svg>
