[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --strict-markers -m "not live_model and not live_llm"
asyncio_mode = auto
markers =
    live_model: mark test as requiring real weights/downloaded models
    live_llm: mark test as requiring real LLM provider credentials
